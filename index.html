<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nabinagar STPP Stage-II — Enterprise WRM Portal</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = { theme: { extend: { colors: { ntpc: { blue: '#0066b3', navy: '#06163a', orange: '#ea580c' } }, fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] } } } };
  </script>

  <style>
    body { background-color: #f8fafc; font-feature-settings: "cv02", "cv03", "cv04", "cv11"; overflow: hidden; }
    .fade-in { animation: fadeIn 0.15s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .custom-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .sticky-th { position: sticky; top: 0; z-index: 20; }
    .sticky-th-sub { position: sticky; top: 38px; z-index: 19; }

    /* PROFESSIONAL A4 PORTRAIT PRINT CSS */
    @media print {
      body { background: white !important; font-family: 'Arial', sans-serif; -webkit-print-color-adjust: exact; overflow: visible; font-size: 11px; }
      .no-print { display: none !important; }
      #printable-mom { display: block !important; width: 100% !important; color: black !important; }
      @page { size: A4 portrait; margin: 12mm; }
      .page-break { page-break-before: always; }
      table { border-collapse: collapse; width: 100%; page-break-inside: auto; margin-bottom: 16px; page-break-after: auto; }
      thead { display: table-header-group; }
      tr { page-break-inside: avoid; page-break-after: auto; }
      th { background-color: #f1f5f9 !important; color: #0f172a !important; font-weight: bold; border: 1px solid #94a3b8; padding: 6px; font-size: 10px; text-transform: uppercase;}
      td { border: 1px solid #94a3b8; padding: 6px; font-size: 10px; vertical-align: top;}
      .print-header-box { text-align: center; border-bottom: 3px solid #0066b3; padding-bottom: 10px; margin-bottom: 15px; }
      .print-title { color: #0066b3; font-size: 26px; font-weight: 900; letter-spacing: -0.5px; margin: 0; text-transform: uppercase;}
      .print-subtitle { font-size: 12px; font-style: italic; font-weight: bold; margin-top: 4px; color: #334155; }
      .header-gradient-line { height: 3px; background: linear-gradient(to right, #0066b3 0%, #85b86b 50%, #ea580c 100%); margin: 6px auto; width: 80%; }
      h3.section-title { font-size: 14px; font-weight: 800; color: #0f172a; border-bottom: 1px solid #cbd5e1; padding-bottom: 4px; margin-top: 20px; margin-bottom: 10px; text-transform: uppercase;}
      .photo-box { width: 180px; height: auto; border: 1px solid #cbd5e1; border-radius: 4px; margin-top: 4px; }
      .print-progress-bar { height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; margin-top: 4px; }
      .print-progress-fill { height: 100%; background: #0066b3; }
    }
  </style>
</head>
<body class="text-slate-800 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, Component } = React;

    const FIREBASE_URL = "https://bopwrm-default-rtdb.firebaseio.com/wrm_db.json";
    const STORAGE_KEY = "ntpc_wrm_projector_v16";

    // GLOBAL ERROR BOUNDARY - Logs precise error without crashing
    class ErrorBoundary extends Component {
      constructor(props) { super(props); this.state = { hasError: false, error: null }; }
      static getDerivedStateFromError(error) { return { hasError: true, error }; }
      componentDidCatch(error, info) { console.error("CRITICAL RENDER HALT:", error, info); }
      render() {
        if (this.state.hasError) {
          return (
            <div className="h-screen w-screen flex flex-col items-center justify-center bg-slate-900 text-white p-8">
              <div className="w-16 h-16 bg-rose-600 rounded-xl flex items-center justify-center text-3xl mb-4">⚠️</div>
              <h1 className="text-2xl font-black uppercase mb-2">Safe Recovery Mode</h1>
              <p className="text-slate-400 mb-6 text-center max-w-lg">A data anomaly (likely a Firebase sparse array) was safely intercepted. Clear the cache below to instantly resolve this.</p>
              <div className="flex gap-4">
                <button onClick={() => { localStorage.removeItem(STORAGE_KEY); window.location.reload(); }} className="bg-rose-600 hover:bg-rose-500 transition px-6 py-3 rounded-lg font-bold">Clear Local Cache & Reload</button>
                <button onClick={() => window.location.reload()} className="bg-ntpc-blue hover:bg-blue-500 transition px-6 py-3 rounded-lg font-bold">↻ Standard Reload</button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const cleanDate = (val) => {
      if (!val) return ""; 
      val = String(val).trim();
      if (/^\d{4}-\d{2}-\d{2}$/.test(val)) return val;
      const parts = val.split(/[-/.]/);
      if (parts.length === 3) {
        if (parts[0].length === 4) return `${parts[0]}-${parts[1].padStart(2, '0')}-${parts[2].padStart(2, '0')}`;
        if (parts[2].length === 4) return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
      }
      return val;
    };

    const compressImage = (file) => {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onerror = () => resolve("");
        reader.onload = (event) => {
          const img = new Image();
          img.onerror = () => resolve("");
          img.onload = () => {
            try {
              const canvas = document.createElement('canvas');
              const MAX_WIDTH = 800;
              const scaleSize = MAX_WIDTH / img.width;
              canvas.width = MAX_WIDTH;
              canvas.height = img.height * scaleSize;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              resolve(canvas.toDataURL('image/jpeg', 0.6));
            } catch(e) { resolve(""); }
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      });
    };

    const getL2DelayStatus = (l) => {
      if (!l) return { isNotStarted: false, isStartedLate: false, isStartOverdue: false, isFinishOverdue: false, delayType: null, targetDisplay: "", actualDisplay: "" };
      const today = new Date(); today.setHours(0,0,0,0);
      
      const effStartStr = l.revStart || l.l2Start || "";
      const effEndStr = l.revEnd || l.l2End || "";

      const effS = effStartStr ? new Date(effStartStr) : null; if(effS && !isNaN(effS)) effS.setHours(0,0,0,0);
      const actS = l.actStart ? new Date(l.actStart) : null; if(actS && !isNaN(actS)) actS.setHours(0,0,0,0);
      const effE = effEndStr ? new Date(effEndStr) : null; if(effE && !isNaN(effE)) effE.setHours(0,0,0,0);
      const actE = l.actEnd ? new Date(l.actEnd) : null; if(actE && !isNaN(actE)) actE.setHours(0,0,0,0);

      let delayType = null, targetDisplay = "", actualDisplay = "Missing Actuals";

      if (effE && !actE && today > effE) { delayType = "Finish Overdue"; targetDisplay = effEndStr; } 
      else if (effE && actE && actE > effE) { delayType = "Finish Delayed"; targetDisplay = effEndStr; actualDisplay = l.actEnd; } 
      else if (effS && !actS && today > effS) { delayType = "Start Overdue"; targetDisplay = effStartStr; } 
      else if (effS && actS && actS > effS) { delayType = "Start Delayed"; targetDisplay = effStartStr; actualDisplay = l.actStart; }

      return { 
        isNotStarted: !actS, 
        isStartedLate: Boolean(effS && actS && actS > effS), 
        isStartOverdue: Boolean(effS && !actS && today > effS), 
        isFinishOverdue: Boolean(effE && !actE && today > effE), 
        delayType, targetDisplay, actualDisplay 
      };
    };

    const DelayTracker = ({ title, tasks = [], discipline, l2Schedule = [] }) => {
      const delayedTasks = (tasks || []).filter(Boolean).map(t => {
        if (!t.l2Ref) return null;
        const l2 = (l2Schedule || []).find(l => l && l.desc === t.l2Ref && (l.subFront || "") === (t.subFront || "") && l.discipline === discipline);
        if (!l2) return null;
        const status = getL2DelayStatus(l2);
        if (!status.delayType) return null;
        return { taskName: t.taskName || "", l2Ref: t.l2Ref || "", subFront: t.subFront || "", targetDisplay: status.targetDisplay, actualDisplay: status.actualDisplay, hindrance: t.hindrance || "No specific hindrance documented", delayType: status.delayType };
      }).filter(Boolean);

      if (delayedTasks.length === 0) return null;

      return (
        <div className="mt-4 border border-rose-200 bg-white rounded-xl overflow-hidden shadow-sm">
          <div className="bg-rose-50 px-4 py-2 border-b border-rose-200 flex justify-between items-center">
            <h4 className="text-[12px] font-black uppercase tracking-wider text-rose-800">{title} Schedule Slips</h4>
            <span className="text-[10px] font-bold text-rose-600 bg-rose-200 px-2 py-0.5 rounded-full">{delayedTasks.length} Fronts Impacted</span>
          </div>
          <table className="w-full text-left text-[11px]">
            <thead className="bg-rose-50/50">
              <tr className="text-rose-900/70 uppercase">
                <th className="py-2 px-4 w-[15%]">Slip Nature</th>
                <th className="py-2 px-4 w-[25%]">Work Front & Task</th>
                <th className="py-2 px-4 w-[12%]">Effective Target</th>
                <th className="py-2 px-4 w-[13%] text-rose-600">Actual/Status</th>
                <th className="py-2 px-4 w-[35%]">Primary Hindrance Cause</th>
              </tr>
            </thead>
            <tbody className="divide-y divide-rose-100">
              {delayedTasks.map((d, i) => (
                <tr key={i} className="text-rose-950 font-bold hover:bg-rose-50/30">
                  <td className="py-2 px-4"><span className="bg-rose-100 text-rose-700 px-2 py-1 rounded text-[10px]">{d.delayType}</span></td>
                  <td className="py-2 px-4"><strong>{d.l2Ref} {d.subFront ? `(${d.subFront})` : ''}</strong><br/><span className="text-slate-500">{d.taskName}</span></td>
                  <td className="py-2 px-4 text-slate-600">{d.targetDisplay}</td>
                  <td className="py-2 px-4"><span className="text-white bg-rose-600 px-2 py-1 rounded shadow-sm text-[10px]">{d.actualDisplay}</span></td>
                  <td className="py-2 px-4 text-rose-800">{d.hindrance}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    };

    const DEFAULT_DB = {
      currentWeek: 35, 
      weeks: [35],
      standardTasks: ["Excavation", "PCC", "RCC", "Backfilling", "Rebar/Steel", "Shuttering", "Brickwork", "Plastering", "Structural Steel Erection", "Wagon Tippler Installation", "Transfer Point Erection"],
      weekMeta: { "35": { manpower: 450, trained: 380, ntpcAttendees: [], tplAttendees: [], distributionList: "hop@ntpc.co.in, pm@tpl.com" } },
      teamMaster: [], l2Schedule: [], masterBOQ: [], civilExecution: [], mechExecution: [], elecExecution: [], drawings: [], safetyLogs: [], qualityLogs: [], actions: []
    };

    // STRICT FIREBASE SANITIZER (Kills Phantom Nulls)
    const sanitizeArray = (arr, fixFn) => {
      if (!Array.isArray(arr)) return [];
      return arr.filter(Boolean).map(item => fixFn ? fixFn(item) : item);
    };

    const sanitizeDB = (data) => {
      if (!data || typeof data !== 'object') return DEFAULT_DB;
      const fixTask = t => ({ ...t, subFront: t.subFront || "", taskName: t.taskName || "" });
      const fixL2 = l => ({ ...l, subFront: l.subFront || "", revStart: l.revStart || "", revEnd: l.revEnd || "", desc: l.desc || "" });
      
      const weeks = Array.isArray(data.weeks) && data.weeks.length ? data.weeks : [35];
      const curWk = data.currentWeek || weeks[0] || 35;
      const weekMeta = data.weekMeta && typeof data.weekMeta === 'object' ? data.weekMeta : {};
      if (!weekMeta[curWk]) weekMeta[curWk] = { manpower: 450, trained: 380, ntpcAttendees: [], tplAttendees: [], distributionList: "" };

      return {
        currentWeek: curWk, 
        weeks: weeks, 
        standardTasks: sanitizeArray(data.standardTasks),
        weekMeta: weekMeta,
        teamMaster: sanitizeArray(data.teamMaster), 
        l2Schedule: sanitizeArray(data.l2Schedule, fixL2),
        masterBOQ: sanitizeArray(data.masterBOQ, fixTask),
        civilExecution: sanitizeArray(data.civilExecution, fixTask), 
        mechExecution: sanitizeArray(data.mechExecution, fixTask), 
        elecExecution: sanitizeArray(data.elecExecution, fixTask),
        drawings: sanitizeArray(data.drawings, fixTask), 
        safetyLogs: sanitizeArray(data.safetyLogs), 
        qualityLogs: sanitizeArray(data.qualityLogs), 
        actions: sanitizeArray(data.actions)
      };
    };

    function MainPortal() {
      const [db, setDbState] = useState(() => { 
        try { 
          const local = localStorage.getItem(STORAGE_KEY); 
          return local ? sanitizeDB(JSON.parse(local)) : DEFAULT_DB; 
        } catch(e) { return DEFAULT_DB; }
      });
      const [cloudStatus, setCloudStatus] = useState("Connecting...");
      const [history, setHistory] = useState([]);

      useEffect(() => {
        setCloudStatus("Fetching Cloud...");
        fetch(FIREBASE_URL)
          .then(res => res.json())
          .then(data => {
            if (data && typeof data === 'object' && Array.isArray(data.weeks)) { 
              setDbState(sanitizeDB(data)); 
              setCloudStatus("Cloud Synced (<80ms)"); 
            } else { 
              saveToCloud(DEFAULT_DB); 
            }
          })
          .catch(() => setCloudStatus("Offline (Local Mode)"));
      }, []);

      const saveToCloud = (dataToSave) => {
        const sanitized = sanitizeDB(dataToSave);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(sanitized)); 
        setCloudStatus("Saving...");
        fetch(FIREBASE_URL, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(sanitized) })
          .then(() => setCloudStatus("Cloud Synced (<80ms)"))
          .catch(() => setCloudStatus("Offline (Saved Locally)"));
      };

      const setDb = (updater) => {
        setDbState(prev => { 
          const nextState = sanitizeDB(typeof updater === 'function' ? updater(prev) : updater); 
          setHistory(h => [...h.slice(-14), prev]); 
          saveToCloud(nextState); 
          return nextState; 
        });
      };

      const handleUndo = () => { 
        if (history.length > 0) { 
          const previous = history[history.length - 1]; 
          setDbState(previous); 
          setHistory(h => h.slice(0, -1)); 
          saveToCloud(previous); 
        } else { alert("No more actions to undo."); }
      };

      const revertTwoHours = () => {
        if(!confirm("WARNING: This will delete ALL rows added within the last 2 hours. Proceed?")) return;
        const threshold = Date.now() - (2 * 60 * 60 * 1000); 
        setDb(prev => {
          const roll = (arr) => (arr||[]).filter(item => !item.createdAt || item.createdAt <= threshold);
          return { 
            ...prev, 
            teamMaster: roll(prev.teamMaster), l2Schedule: roll(prev.l2Schedule), masterBOQ: roll(prev.masterBOQ), 
            civilExecution: roll(prev.civilExecution), mechExecution: roll(prev.mechExecution), elecExecution: roll(prev.elecExecution), 
            drawings: roll(prev.drawings), safetyLogs: roll(prev.safetyLogs), qualityLogs: roll(prev.qualityLogs), actions: roll(prev.actions) 
          };
        });
      };

      const [tab, setTab] = useState("DASHBOARD");
      const [weekNo, setWeekNo] = useState(db.currentWeek || 35);
      const [activeDiscipline, setActiveDiscipline] = useState("Civil");
      
      const [selectedIds, setSelectedIds] = useState([]);
      const [showPasteModal, setShowPasteModal] = useState(false);
      const [pasteType, setPasteType] = useState("L2");
      const [pasteText, setPasteText] = useState("");

      const [showPrintModal, setShowPrintModal] = useState(false);
      const [printIncludeDashboard, setPrintIncludeDashboard] = useState(true);
      const [printIncludePhotos, setPrintIncludePhotos] = useState(true);

      const [showLogModal, setShowLogModal] = useState(false);
      const [logForm, setLogForm] = useState({ type: "Safety", category: "Unsafe Condition", dept: "Civil", desc: "", file: null });
      const [viewImage, setViewImage] = useState(null);

      const [showTaskModal, setShowTaskModal] = useState(false);
      const [newTaskInput, setNewTaskInput] = useState("");

      useEffect(() => { setSelectedIds([]); }, [tab, activeDiscipline]);

      const currentMeta = (db.weekMeta && db.weekMeta[weekNo]) ? db.weekMeta[weekNo] : { manpower: 0, trained: 0, ntpcAttendees: [], tplAttendees: [], distributionList: "" };
      const activeTasks = ((activeDiscipline === "Civil" ? db.civilExecution : activeDiscipline === "Mechanical" ? db.mechExecution : db.elecExecution) || []).filter(t => t && t.weekNo === weekNo);
      
      const toggleSelect = (id) => setSelectedIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
      const toggleSelectAll = (ids) => setSelectedIds(prev => prev.length === ids.length ? [] : ids);
      const deleteSelected = (collectionName) => { 
        if(!confirm(`Delete ${selectedIds.length} items?`)) return; 
        setDb(prev => ({ ...prev, [collectionName]: (prev[collectionName] || []).filter(item => !selectedIds.includes(item.id)) })); 
        setSelectedIds([]); 
      };
      const deleteIndividual = (collectionName, id) => { 
        if(!confirm("Delete this row?")) return; 
        setDb(prev => ({ ...prev, [collectionName]: (prev[collectionName] || []).filter(item => item.id !== id) })); 
      };

      const exportBackup = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db, null, 2));
        const a = document.createElement('a'); 
        a.setAttribute("href", dataStr); 
        a.setAttribute("download", `NTPC_WRM_Data_Wk${weekNo}.json`);
        document.body.appendChild(a); 
        a.click(); 
        a.remove();
      };

      const importBackup = (e) => {
        const file = e.target.files[0]; 
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (parsed) { 
              setDbState(sanitizeDB(parsed)); 
              setWeekNo(parsed.currentWeek || 35); 
              alert("Data restored successfully."); 
            } else { 
              alert("Invalid backup file format"); 
            }
          } catch(err) { alert("Error parsing file: " + err.message); }
        }; 
        reader.readAsText(file);
      };

      const exportToExcel = () => {
        const wb = XLSX.utils.book_new();
        const formatExec = (arr) => (arr || []).filter(t => t && t.weekNo === weekNo).map(t => ({ "L2 Ref": t.l2Ref || "", "Branch": t.subFront || "", "Task": t.taskName || "", "Unit": t.unit || "", "Plan": t.plan || 0, "Actual": t.act || 0, "Variance": (t.act || 0) - (t.plan || 0), "Cum. Backlog": t.cumBacklog || 0, "Next Plan": t.next || 0, "Hindrance": t.hindrance || "", "TPL Remarks": t.tplRemarks || "", "NTPC Directives": t.ntpcDirectives || "" }));
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(formatExec(db.civilExecution)), "Civil Works");
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(formatExec(db.mechExecution)), "Mechanical Works");
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(formatExec(db.elecExecution)), "Electrical Works");
        
        const boqData = computedBOQ.map(b => ({ "Discipline": b.discipline, "L2 Ref": b.l2Ref, "Branch": b.subFront, "Task": b.taskName, "Unit": b.uom, "Total Scope": b.totalScope, "Historical Actual": b.historicalActual, "App Weeks Actual": b.appActuals, "Total Cumulative": b.totalCum, "Balance": b.balance, "% Complete": b.pct + "%" }));
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(boqData), "Master BOQ Progress");

        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet((db.drawings || []).filter(d => d && d.weekNo === weekNo).map(d => ({ "L2 Ref": d.l2Ref || "", "Branch": d.subFront || "", "Discipline": d.discipline || "", "Drawing No": d.drawingNo || "", "Desc": d.desc || "", "Priority": d.priority || "", "Target": d.targetDate || "", "Status": d.status || "", "Impact": d.frontImpact || "" }))), "Drawings DCI");
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet((db.actions || []).filter(a => a && a.weekNo === weekNo).map(a => ({ "Category": a.category || "", "Description": a.desc || "", "Responsibility": a.responsibility || "", "Target": a.targetDate || "", "Status": a.status || "", "NTPC Remarks": a.ntpcRemarks || "" }))), "Action Tracker");
        XLSX.writeFile(wb, `NTPC_WRM_Week_${weekNo}_Export.xlsx`);
      };

      const executeExcelImport = () => {
        if (!pasteText.trim()) return; 
        const rows = pasteText.trim().split("\n").map(r => r.split("\t")); 
        const ts = Date.now();
        if (pasteType === "Team") { 
          setDb(prev => ({ ...prev, teamMaster: [...rows.map((r, i) => ({ id: "TM-" + ts + i, empId: (r[0] || "").trim(), name: (r[1] || "").trim(), desig: (r[2] || "").trim(), dept: (r[3] || "").trim(), org: (r[4] || "NTPC").trim(), createdAt: ts })).filter(item => item.name), ...(prev.teamMaster || [])] })); 
        } else if (pasteType === "L2") { 
          setDb(prev => ({ ...prev, l2Schedule: [...rows.map((r, i) => ({ id: "L2-" + ts + i, discipline: (r[0] || "Civil").trim(), desc: (r[1] || "").trim(), subFront: (r[2] || "").trim(), l2Start: cleanDate(r[3]), revStart: cleanDate(r[4]), actStart: cleanDate(r[5]), l2End: cleanDate(r[6]), revEnd: cleanDate(r[7]), actEnd: cleanDate(r[8]), createdAt: ts })).filter(item => item.desc), ...(prev.l2Schedule || [])] })); 
        } else if (pasteType === "BOQ") { 
          setDb(prev => ({ ...prev, masterBOQ: [...rows.map((r, i) => ({ id: "BOQ-" + ts + i, discipline: (r[0] || "Civil").trim(), l2Ref: (r[1] || "").trim(), subFront: (r[2] || "").trim(), taskName: (r[3] || "").trim(), uom: (r[4] || "m³").trim(), totalScope: parseFloat(r[5])||0, historicalActual: parseFloat(r[6])||0, createdAt: ts })).filter(item => item.taskName), ...(prev.masterBOQ || [])] })); 
        } else if (pasteType === "Drawings") { 
          setDb(prev => ({ ...prev, drawings: [...rows.map((r, i) => ({ id: "DW-" + ts + i, weekNo, l2Ref: (r[0] || "").trim(), subFront: (r[1] || "").trim(), discipline: (r[2] || "Civil").trim(), drawingNo: (r[3] || "").trim(), desc: (r[4] || "").trim(), priority: (r[5] || "Moderate").trim(), targetDate: cleanDate(r[6]), expectedDate: cleanDate(r[7]), status: (r[8] || "Pending").trim(), frontImpact: (r[9] || "").trim(), remarks: (r[10] || "").trim(), createdAt: ts })).filter(item => item.drawingNo), ...(prev.drawings || [])] })); 
        } else if (pasteType === "Actions") { 
          setDb(prev => ({ ...prev, actions: [...rows.map((r, i) => ({ id: "ACT-" + ts + i, weekNo, category: (r[0] || "Execution").trim(), desc: (r[1] || "").trim(), responsibility: (r[2] || "TPL").trim(), targetDate: cleanDate(r[3]), revisedDate: cleanDate(r[4]), status: (r[5] || "Pending").trim(), ntpcRemarks: (r[6] || "").trim(), createdAt: ts })).filter(item => item.desc), ...(prev.actions || [])] })); 
        } else {
          const col = activeDiscipline === "Civil" ? "civilExecution" : activeDiscipline === "Mechanical" ? "mechExecution" : "elecExecution";
          const prefix = activeDiscipline === "Civil" ? "CV-" : activeDiscipline === "Mechanical" ? "MC-" : "EL-";
          setDb(prev => ({ ...prev, [col]: [...rows.map((r, i) => ({ id: prefix + ts + i, weekNo, l2Ref: (r[0] || "").trim(), subFront: (r[1] || "").trim(), taskName: (r[2] || "").trim(), unit: (r[3] || (activeDiscipline === "Civil" ? "m³" : "MT")).trim(), plan: parseFloat(r[4]) || 0, act: parseFloat(r[5]) || 0, next: parseFloat(r[6]) || 0, cumBacklog: parseFloat(r[7]) || 0, hindrance: (r[8] || "").trim(), tplRemarks: (r[9] || "").trim(), ntpcDirectives: (r[10] || "").trim(), milestone: "In Progress", createdAt: ts })).filter(item => item.taskName), ...(prev[col] || [])] }));
        }
        setPasteText(""); 
        setShowPasteModal(false);
      };

      const handleTaskUpdates = (taskId, updates, collection) => {
        setDb(prev => ({
          ...prev, 
          [collection]: (prev[collection] || []).map(item => {
            if (item.id !== taskId) return item;
            const nextItem = { ...item, ...updates };
            if ('plan' in updates || 'act' in updates) {
              const p = parseFloat(nextItem.plan) || 0; 
              const a = parseFloat(nextItem.act) || 0;
              nextItem.cumBacklog = Math.max(0, (parseFloat(item.prevBacklog||0)) + (p - a));
            }
            return nextItem;
          })
        }));
      };

      const handleAddRow = (type) => {
        const ts = Date.now();
        if (type === "L2") { setDb(prev => ({ ...prev, l2Schedule: [{ id: "L2-"+ts, discipline: "Civil", desc: "", subFront: "", l2Start: "", revStart: "", actStart: "", l2End: "", revEnd: "", actEnd: "", createdAt: ts }, ...(prev.l2Schedule || [])] })); } 
        else if (type === "Team") { setDb(prev => ({ ...prev, teamMaster: [{ id: "TM-"+ts, empId: "", name: "", desig: "", dept: "", org: "NTPC", createdAt: ts }, ...(prev.teamMaster || [])] })); } 
        else if (type === "BOQ") { setDb(prev => ({ ...prev, masterBOQ: [{ id: "BOQ-"+ts, discipline: activeDiscipline, l2Ref: "", subFront: "", taskName: "", uom: activeDiscipline==="Civil"?"m³":"MT", totalScope: 0, historicalActual: 0, createdAt: ts }, ...(prev.masterBOQ || [])] })); } 
        else if (type === "Drawings") { setDb(prev => ({ ...prev, drawings: [{ id: "DW-"+ts, weekNo, l2Ref: "", subFront: "", discipline: "Civil", drawingNo: "", desc: "", priority: "Moderate", targetDate: "", expectedDate: "", status: "Pending", frontImpact: "", remarks: "", createdAt: ts }, ...(prev.drawings || [])] })); } 
        else if (type === "Actions") { setDb(prev => ({ ...prev, actions: [{ id: "ACT-"+ts, weekNo, category: "Execution", desc: "", responsibility: "TPL", targetDate: "", revisedDate: "", status: "Pending", ntpcRemarks: "", createdAt: ts }, ...(prev.actions || [])] })); } 
        else {
          const col = type === "Civil" ? "civilExecution" : type === "Mechanical" ? "mechExecution" : "elecExecution";
          const prefix = type === "Civil" ? "CV-" : type === "Mechanical" ? "MC-" : "EL-";
          setDb(prev => ({ ...prev, [col]: [{ id: prefix+ts, weekNo, l2Ref: "", subFront: "", taskName: "", unit: type==="Civil"?"m³":type==="Mechanical"?"MT":"m", plan: 0, act: 0, next: 0, cumBacklog: 0, prevBacklog: 0, hindrance: "", tplRemarks: "", ntpcDirectives: "", milestone: "In Progress", createdAt: ts }, ...(prev[col] || [])] }));

        const collection = logForm.type === "Safety" ? "safetyLogs" : "qualityLogs";
        const prefix = logForm.type === "Safety" ? "SAF-" : "QAL-";
        const newEntry = { id: prefix + ts, weekNo, dept: logForm.dept, category: logForm.category, desc: logForm.desc, status: "Open", photoUrl: compressedBase64, createdAt: ts };
        
        setDb(prev => ({ ...prev, [collection]: [newEntry, ...(prev[collection] || [])] }));
        setShowLogModal(false); 
        setLogForm({ type: "Safety", category: "Unsafe Condition", dept: "Civil", desc: "", file: null });
        setCloudStatus("Cloud Synced (<80ms)");

      const toggleAttendee = (org, id) => {

        setDb(prev => {

          const exists = currentList.find(a => a && a.id === id);
          let newList = exists ? currentList.filter(a => a && a.id !== id) : [...currentList, { id: emp.id, name: emp.name, desig: emp.desig }];
          return { ...prev, weekMeta: { ...prev.weekMeta, [weekNo]: { ...(prev.weekMeta[weekNo] || {}), [field]: newList } } };
        });
      };

      const computedBOQ = useMemo(() => {
        return (db.masterBOQ || []).filter(Boolean).map(boq => {
          const relevantExecs = boq.discipline === "Civil" ? (db.civilExecution || []) : boq.discipline === "Mechanical" ? (db.mechExecution || []) : (db.elecExecution || []);
          const appActuals = relevantExecs.filter(ex => ex && ex.l2Ref === boq.l2Ref && (ex.subFront || "") === (boq.subFront || "") && ex.taskName === boq.taskName).reduce((sum, ex) => sum + (parseFloat(ex.act) || 0), 0);
          const totalCum = (parseFloat(boq.historicalActual) || 0) + appActuals;
          const scope = parseFloat(boq.totalScope) || 0;
          const balance = Math.max(0, scope - totalCum);
          const pct = scope > 0 ? Math.min(100, Math.round((totalCum / scope) * 100)) : 0;
          return { ...boq, appActuals, totalCum, balance, pct };
        });
      }, [db.masterBOQ, db.civilExecution, db.mechExecution, db.elecExecution]);

      const commoditySummary = useMemo(() => {
        const grouped = {};
        (computedBOQ || []).forEach(b => {

          grouped[b.taskName].actual += (parseFloat(b.totalCum) || 0);

                  const nx = parseInt(prompt("Enter New Week Number:", weekNo + 1));

                      const rollD = (prev.drawings || []).filter(d => d && d.weekNo === weekNo && !String(d.status).includes("Approved")).map(d => ({...d, id: "DW-"+Date.now()+Math.floor(Math.random()*100), weekNo: nx, createdAt: Date.now()}));

                            <td className="p-2"><input type="text" value={t.desig} onChange={e => handleTaskUpdates(t.id, {desig: e.target.value}, "teamMaster")} className="w-full bg-slate-100 p-2 rounded font-bold outline-none" placeholder="e.g. HOP, GM"/></td>

                            <td className="p-2"><select value={t.org} onChange={e => handleTaskUpdates(t.id, {org: e.target.value}, "teamMaster")} className="w-full bg-slate-100 p-2 rounded font-bold outline-none"><option>NTPC</option><option>TPL</option></select></td>

                  </div>

                        </select>

          )}

          {showPrintModal && (
            <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 fade-in">
              <div className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl space-y-5">
                <h3 className="text-lg font-black uppercase text-ntpc-blue">Configure A4 Print MoM</h3>
                <label className="flex items-center gap-3 text-sm font-bold cursor-pointer bg-slate-50 p-3 rounded-lg border border-slate-200"><input type="checkbox" checked={printIncludeDashboard} onChange={e => setPrintIncludeDashboard(e.target.checked)} className="w-5 h-5 accent-ntpc-blue" />Include Dashboard & BOQ</label>
                <label className="flex items-center gap-3 text-sm font-bold cursor-pointer bg-slate-50 p-3 rounded-lg border border-slate-200"><input type="checkbox" checked={printIncludePhotos} onChange={e => setPrintIncludePhotos(e.target.checked)} className="w-5 h-5 accent-ntpc-blue" />Include Safety/QA Photos</label>
                <div className="flex gap-2">
                  <button onClick={() => setShowPrintModal(false)} className="flex-1 bg-slate-100 py-2.5 rounded-lg text-xs font-black uppercase hover:bg-slate-200">Cancel</button>
                  <button onClick={() => { setShowPrintModal(false); setTimeout(() => window.print(), 300); }} className="flex-1 bg-ntpc-blue text-white py-2.5 rounded-lg text-xs font-black uppercase shadow hover:bg-blue-800">Confirm & Print</button>
                </div>
              </div>
            </div>
          )}

          {/* ========================================================= */}
          {/* PROFESSIONAL A4 PORTRAIT MOM PRINT TEMPLATE */}
          {/* ========================================================= */}
          <div id="printable-mom" className="hidden print:block font-sans bg-white text-black">
            
            <div className="print-header-box">
              <h1 className="print-title">Nabinagar Super Thermal Power Project</h1>
              <div className="header-gradient-line"></div>
            </div>

            <div className="flex justify-between items-end mb-4 border-b border-black pb-2">
              <h2 className="text-[14px] font-black uppercase tracking-wider">Minutes of Weekly Review Meeting (WRM) — Week #{weekNo}</h2>
              <div className="text-[10px] font-bold text-right uppercase">REF: NTPC/NSTPP-II/WRM/WK-{weekNo}<br />Date: {new Date().toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' })}</div>
            </div>

            <h3 className="section-title">1. Meeting Participants & Site Metrics</h3>
            <table>
              <thead><tr><th className="w-[35%]">Employer (NTPC)</th><th className="w-[35%]">Contractor (M/s TPL)</th><th className="w-[30%] text-center">Site Operational Metrics</th></tr></thead>
              <tbody>
                <tr>
                  <td><ul className="list-disc pl-4 m-0">{(currentMeta.ntpcAttendees || []).map((a, i) => <li key={i}><strong>{a.name}</strong> — {a.desig}</li>)}</ul></td>
                  <td><ul className="list-disc pl-4 m-0">{(currentMeta.tplAttendees || []).map((a, i) => <li key={i}><strong>{a.name}</strong> — {a.desig}</li>)}</ul></td>
                  <td className="font-bold text-center bg-[#f1f5f9] text-[12px] pt-4">Total Deployed Manpower: {currentMeta.manpower}<br/><br/>Total Persons Trained: {currentMeta.trained}</td>
                </tr>
              </tbody>
            </table>

            {printIncludeDashboard && (
              <React.Fragment>
                <h3 className="section-title">2. Executive Dashboard Summary</h3>
                <table>
                  <thead><tr><th>Civil Targets Hit</th><th>Mech Targets Hit</th><th>Elec Targets Hit</th><th>Pending Drawings</th><th>Open Bottlenecks</th><th>Open Safety/QA</th></tr></thead>
                  <tbody>
                    <tr>
                      <td className="text-center font-bold text-blue-900">{getHitCount(civilWk)} / {civilWk.length}</td>
                      <td className="text-center font-bold text-amber-700">{getHitCount(mechWk)} / {mechWk.length}</td>
                      <td className="text-center font-bold text-emerald-800">{getHitCount(elecWk)} / {elecWk.length}</td>
                      <td className="text-center font-bold">{pendingDwgs}</td>
                      <td className="text-center font-bold text-rose-700">{openActs}</td>
                      <td className="text-center font-bold">{openHse + (db.qualityLogs || []).filter(q => q && q.weekNo === weekNo && q.status === "Open").length}</td>
                    </tr>
                  </tbody>
                </table>

                {commoditySummary.length > 0 && (
                  <React.Fragment>
                    <h3 className="section-title">3. Site-Wide Commodity Progress</h3>
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px', marginBottom: '16px' }}>
                      {commoditySummary.map((c, i) => (
                        <div key={i} style={{ border: '1px solid #cbd5e1', padding: '8px', borderRadius: '4px' }}>
                          <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '4px' }}>
                            <strong style={{ fontSize: '10px', textTransform: 'uppercase' }}>{c.task}</strong>
                            <span style={{ fontSize: '9px' }}>{c.actual} / {c.scope} {c.uom} ({c.pct}%)</span>
                          </div>
                          <div className="print-progress-bar w-full"><div className="print-progress-fill" style={{width: `${c.pct}%`}}></div></div>
                        </div>
                      ))}
                    </div>
                  </React.Fragment>
                )}
              </React.Fragment>
            )}

            <h3 className="section-title">{printIncludeDashboard && commoditySummary.length > 0 ? "4" : printIncludeDashboard ? "3" : "2"}. Discipline Execution Performance</h3>
            <table>
              <thead><tr><th className="w-[22%]">Work Front & Task</th><th className="text-center w-10">Plan</th><th className="text-center w-10">Act</th><th className="text-center w-10">Var</th><th className="text-center w-10">Backlog</th><th className="w-[18%]">Hindrance</th><th className="w-[18%]">TPL Remarks</th><th className="w-[18%]">NTPC Directives</th></tr></thead>
              <tbody>
                {[...civilWk, ...mechWk, ...elecWk].map((c, i) => (
                  <tr key={i}>
                    <td><strong>{c.l2Ref} {c.subFront ? `(${c.subFront})` : ''}</strong><br/>{c.taskName} ({c.unit})</td>
                    <td className="text-center font-bold text-blue-900">{c.plan}</td>
                    <td className="text-center font-bold text-emerald-800">{c.act}</td>
                    <td className="text-center font-black">{(parseFloat(c.act) || 0) - (parseFloat(c.plan) || 0)}</td>
                    <td className="text-center font-bold text-rose-800">{c.cumBacklog}</td>
                    <td>{c.hindrance}</td><td>{c.tplRemarks}</td><td className="font-bold">{c.ntpcDirectives}</td>
                  </tr>
                ))}
              </tbody>
            </table>

            <div className="page-break"></div>
            <div className="print-header-box"><h1 className="print-title">Nabinagar Super Thermal Power Project</h1><div className="header-gradient-line"></div></div>

            <h3 className="section-title">{printIncludeDashboard && commoditySummary.length > 0 ? "5" : printIncludeDashboard ? "4" : "3"}. Priority Actions & Bottlenecks</h3>
            <table>
              <thead><tr><th className="w-[30%]">Action Description</th><th className="w-[15%]">Resp</th><th className="text-center w-[15%]">Target</th><th className="text-center w-[10%]">Status</th><th className="w-[30%]">NTPC Review Directives</th></tr></thead>
              <tbody>
                {(db.actions || []).filter(a => a && a.weekNo === weekNo).map((a, i) => (
                  <tr key={i}>
                    <td><strong>{a.desc}</strong></td><td>{a.responsibility}</td>
                    <td className="text-center font-bold">{a.targetDate}</td><td className="text-center font-bold uppercase">{a.status}</td>
                    <td className="font-bold">{a.ntpcRemarks}</td>
                  </tr>
                ))}
              </tbody>
            </table>

            <h3 className="section-title">{printIncludeDashboard && commoditySummary.length > 0 ? "6" : printIncludeDashboard ? "5" : "4"}. HSE & Quality Assurance Logs</h3>
            <table>
              <thead><tr><th className="w-[20%]">Dept & Category</th><th className="w-[50%]">Observation Detail</th><th className="text-center w-[15%]">Status</th>{printIncludePhotos && <th className="text-center w-[15%]">Evidence</th>}</tr></thead>
              <tbody>
                {[...(db.safetyLogs || []), ...(db.qualityLogs || [])].filter(s => s && s.weekNo === weekNo).map((s, i) => (
                  <tr key={i}>
                    <td><strong>{s.dept || "Site"}</strong><br/>{s.category}</td>
                    <td>{s.desc}</td>
                    <td className="text-center font-bold uppercase">{s.status}</td>
                    {printIncludePhotos && (
                      <td className="text-center">{s.photoUrl ? <img src={s.photoUrl} className="photo-box mx-auto" /> : "No Photo"}</td>
                    )}
                  </tr>
                ))}
              </tbody>
            </table>

            <div className="mt-24 flex justify-between text-[11px] font-bold uppercase px-12">
              <div className="text-center border-t-2 border-slate-400 pt-2 w-48">Employer Representative<br/><strong>(NTPC Limited)</strong></div>
              <div className="text-center border-t-2 border-slate-400 pt-2 w-48">Contractor Representative<br/><strong>(M/s TPL)</strong></div>
            </div>
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><MainPortal /></ErrorBoundary>);
  </script>
</body>
</html>
