<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nabinagar STPP Stage-II — Live WRM Portal</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = { theme: { extend: { colors: { ntpc: { blue: '#0066b3', navy: '#06163a', orange: '#ea580c' } }, fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] } } } };
  </script>

  <style>
    body { background-color: #f8fafc; font-feature-settings: "cv02", "cv03", "cv04", "cv11"; }
    .fade-in { animation: fadeIn 0.15s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .custom-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .sticky-th { position: sticky; top: 0; z-index: 20; }
    .sticky-th-sub { position: sticky; top: 38px; z-index: 19; }

    /* PROFESSIONAL A4 PORTRAIT PRINT CSS */
    @media print {
      body { background: white !important; font-family: 'Arial', sans-serif; -webkit-print-color-adjust: exact; overflow: visible; font-size: 11px; }
      .no-print { display: none !important; }
      #printable-mom { display: block !important; width: 100% !important; color: black !important; }
      @page { size: A4 portrait; margin: 12mm; }
      .page-break { page-break-before: always; }
      table { border-collapse: collapse; width: 100%; page-break-inside: auto; margin-bottom: 16px; }
      tr { page-break-inside: avoid; page-break-after: auto; }
      th { background-color: #f1f5f9 !important; color: #0f172a !important; font-weight: bold; border: 1px solid #94a3b8; padding: 8px; font-size: 11px; text-transform: uppercase;}
      td { border: 1px solid #94a3b8; padding: 8px; font-size: 11px; vertical-align: top;}
      .print-header-box { text-align: center; border-bottom: 3px solid #0066b3; padding-bottom: 10px; margin-bottom: 15px; }
      .print-title { color: #0066b3; font-size: 26px; font-weight: 900; letter-spacing: -0.5px; margin: 0; text-transform: uppercase;}
      .print-subtitle { font-size: 12px; font-style: italic; font-weight: bold; margin-top: 4px; color: #334155; }
      .header-gradient-line { height: 3px; background: linear-gradient(to right, #0066b3 0%, #85b86b 50%, #ea580c 100%); margin: 6px auto; width: 80%; }
      h3.section-title { font-size: 14px; font-weight: 800; color: #0f172a; border-bottom: 1px solid #cbd5e1; padding-bottom: 4px; margin-top: 20px; margin-bottom: 10px; text-transform: uppercase;}
      .photo-box { width: 180px; height: auto; border: 1px solid #cbd5e1; border-radius: 4px; margin-top: 4px; }
    }
  </style>
</head>
<body class="text-slate-800 antialiased overflow-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const FIREBASE_URL = "https://bopwrm-default-rtdb.firebaseio.com/wrm_db.json";
    const STORAGE_KEY = "ntpc_wrm_projector_v8";

    const cleanDate = (val) => {
      if (!val) return ""; val = val.trim();
      if (/^\d{4}-\d{2}-\d{2}$/.test(val)) return val;
      const parts = val.split(/[-/.]/);
      if (parts.length === 3) {
        if (parts[0].length === 4) return `${parts[0]}-${parts[1].padStart(2, '0')}-${parts[2].padStart(2, '0')}`;
        if (parts[2].length === 4) return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
      }
      return val;
    };

    // Auto-Compressor to prevent browser crashes on huge phone photos
    const compressImage = (file) => {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 800;
            const scaleSize = MAX_WIDTH / img.width;
            canvas.width = MAX_WIDTH;
            canvas.height = img.height * scaleSize;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.7)); // 70% quality compression
          };
        };
      });
    };

    const DEFAULT_DB = {
      currentWeek: 35, weeks: [35],
      weekMeta: { "35": { manpower: 450, trained: 380, ntpcAttendees: [], tplAttendees: [], distributionList: "hop@ntpc.co.in, pm@tpl.com" } },
      teamMaster: [], l2Schedule: [], civilExecution: [], mechExecution: [], elecExecution: [], drawings: [], safetyLogs: [], qualityLogs: [], actions: []
    };

    const sanitizeDB = (data) => {
      if (!data || typeof data !== 'object') return DEFAULT_DB;
      return {
        currentWeek: data.currentWeek || 35, weeks: Array.isArray(data.weeks) ? data.weeks : [35], weekMeta: data.weekMeta || DEFAULT_DB.weekMeta,
        teamMaster: Array.isArray(data.teamMaster) ? data.teamMaster : [], l2Schedule: Array.isArray(data.l2Schedule) ? data.l2Schedule : [],
        civilExecution: Array.isArray(data.civilExecution) ? data.civilExecution : [], mechExecution: Array.isArray(data.mechExecution) ? data.mechExecution : [], elecExecution: Array.isArray(data.elecExecution) ? data.elecExecution : [],
        drawings: Array.isArray(data.drawings) ? data.drawings : [], safetyLogs: Array.isArray(data.safetyLogs) ? data.safetyLogs : [], qualityLogs: Array.isArray(data.qualityLogs) ? data.qualityLogs : [], actions: Array.isArray(data.actions) ? data.actions : []
      };
    };

    function App() {
      const [db, setDbState] = useState(() => { try { const local = localStorage.getItem(STORAGE_KEY); return local ? sanitizeDB(JSON.parse(local)) : DEFAULT_DB; } catch(e) { return DEFAULT_DB; }});
      const [cloudStatus, setCloudStatus] = useState("Connecting...");
      const [history, setHistory] = useState([]);

      useEffect(() => {
        setCloudStatus("Fetching Cloud...");
        fetch(FIREBASE_URL).then(res => res.json()).then(data => {
          if (data && Array.isArray(data.weeks)) { setDbState(sanitizeDB(data)); setCloudStatus("Cloud Synced (<80ms)"); } 
          else { saveToCloud(DEFAULT_DB); }
        }).catch(() => setCloudStatus("Offline (Local Mode)"));
      }, []);

      const saveToCloud = (dataToSave) => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(dataToSave));
        setCloudStatus("Saving...");
        fetch(FIREBASE_URL, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(dataToSave) })
        .then(() => setCloudStatus("Cloud Synced (<80ms)")).catch(() => setCloudStatus("Offline (Saved Locally)"));
      };

      const setDb = (updater) => {
        setDbState(prev => { const nextState = sanitizeDB(typeof updater === 'function' ? updater(prev) : updater); setHistory(h => [...h.slice(-14), prev]); saveToCloud(nextState); return nextState; });
      };

      const handleUndo = () => { if (history.length > 0) { const previous = history[history.length - 1]; setDbState(previous); setHistory(h => h.slice(0, -1)); saveToCloud(previous); } else { alert("No more actions to undo."); }};

      const revertTwoHours = () => {
        if(!confirm("WARNING: This will delete ALL rows added within the last 2 hours. Proceed?")) return;
        const threshold = Date.now() - (2 * 60 * 60 * 1000); 
        setDb(prev => {
          const roll = (arr) => (arr||[]).filter(item => !item.createdAt || item.createdAt <= threshold);
          return { ...prev, teamMaster: roll(prev.teamMaster), l2Schedule: roll(prev.l2Schedule), civilExecution: roll(prev.civilExecution), mechExecution: roll(prev.mechExecution), elecExecution: roll(prev.elecExecution), drawings: roll(prev.drawings), safetyLogs: roll(prev.safetyLogs), qualityLogs: roll(prev.qualityLogs), actions: roll(prev.actions) };
        });
      };

      const [tab, setTab] = useState("DASHBOARD");
      const [weekNo, setWeekNo] = useState(db.currentWeek || 35);
      const [activeDiscipline, setActiveDiscipline] = useState("Civil");
      
      const [selectedIds, setSelectedIds] = useState([]);
      const [showPasteModal, setShowPasteModal] = useState(false);
      const [pasteType, setPasteType] = useState("L2");
      const [pasteText, setPasteText] = useState("");

      const [showPrintModal, setShowPrintModal] = useState(false);
      const [printIncludeDashboard, setPrintIncludeDashboard] = useState(true);
      const [printIncludePhotos, setPrintIncludePhotos] = useState(true);

      const [showLogModal, setShowLogModal] = useState(false);
      const [logForm, setLogForm] = useState({ type: "Safety", category: "Unsafe Condition", dept: "Civil", desc: "", file: null });
      const [viewImage, setViewImage] = useState(null);

      useEffect(() => { setSelectedIds([]); }, [tab, activeDiscipline]);

      const currentMeta = db.weekMeta[weekNo] || { manpower: 0, trained: 0, ntpcAttendees: [], tplAttendees: [], distributionList: "" };
      const activeTasks = (activeDiscipline === "Civil" ? db.civilExecution : activeDiscipline === "Mechanical" ? db.mechExecution : db.elecExecution).filter(t => t.weekNo === weekNo);
      
      const toggleSelect = (id) => setSelectedIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
      const toggleSelectAll = (ids) => setSelectedIds(prev => prev.length === ids.length ? [] : ids);
      const deleteSelected = (collectionName) => { if(!confirm(`Delete ${selectedIds.length} items?`)) return; setDb(prev => ({ ...prev, [collectionName]: prev[collectionName].filter(item => !selectedIds.includes(item.id)) })); setSelectedIds([]); };
      const deleteIndividual = (collectionName, id) => { if(!confirm("Delete this row?")) return; setDb(prev => ({ ...prev, [collectionName]: prev[collectionName].filter(item => item.id !== id) })); };

      const exportToExcel = () => {
        const wb = XLSX.utils.book_new();
        const formatExec = (arr) => arr.filter(t => t.weekNo === weekNo).map(t => ({ "L2 Ref": t.l2Ref, "Task": t.taskName, "Unit": t.unit, "Plan": t.plan, "Actual": t.act, "Variance": t.act - t.plan, "Cum. Backlog": t.cumBacklog, "Next Plan": t.next, "Hindrance": t.hindrance, "TPL Remarks": t.tplRemarks, "NTPC Directives": t.ntpcDirectives }));
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(formatExec(db.civilExecution)), "Civil Works");
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(formatExec(db.mechExecution)), "Mechanical Works");
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(formatExec(db.elecExecution)), "Electrical Works");
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(db.drawings.filter(d => d.weekNo === weekNo).map(d => ({ "L2 Ref": d.l2Ref, "Discipline": d.discipline, "Drawing No": d.drawingNo, "Desc": d.desc, "Priority": d.priority, "Target": d.targetDate, "Status": d.status, "Impact": d.frontImpact }))), "Drawings DCI");
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(db.actions.filter(a => a.weekNo === weekNo).map(a => ({ "Category": a.category, "Description": a.desc, "Responsibility": a.responsibility, "Target": a.targetDate, "Status": a.status, "NTPC Remarks": a.ntpcRemarks }))), "Action Tracker");
        XLSX.writeFile(wb, `NTPC_WRM_Week_${weekNo}_Export.xlsx`);
      };

      const executeExcelImport = () => {
        if (!pasteText.trim()) return; const rows = pasteText.trim().split("\n").map(r => r.split("\t")); const ts = Date.now();
        if (pasteType === "Team") { setDb(prev => ({ ...prev, teamMaster: [...rows.map((r, i) => ({ id: "TM-" + ts + i, empId: (r[0] || "").trim(), name: (r[1] || "").trim(), desig: (r[2] || "").trim(), dept: (r[3] || "").trim(), org: (r[4] || "NTPC").trim(), createdAt: ts })).filter(item => item.name), ...prev.teamMaster] })); } 
        else if (pasteType === "L2") { setDb(prev => ({ ...prev, l2Schedule: [...rows.map((r, i) => ({ id: "L2-" + ts + i, discipline: (r[0] || "Civil").trim(), desc: (r[1] || "").trim(), l2Start: cleanDate(r[2]), actStart: cleanDate(r[3]), l2End: cleanDate(r[4]), actEnd: cleanDate(r[5]), createdAt: ts })).filter(item => item.desc), ...prev.l2Schedule] })); } 
        else if (pasteType === "Drawings") { setDb(prev => ({ ...prev, drawings: [...rows.map((r, i) => ({ id: "DW-" + ts + i, weekNo, l2Ref: (r[0] || "").trim(), discipline: (r[1] || "Civil").trim(), drawingNo: (r[2] || "").trim(), desc: (r[3] || "").trim(), priority: (r[4] || "Moderate").trim(), targetDate: cleanDate(r[5]), expectedDate: cleanDate(r[6]), status: (r[7] || "Pending").trim(), frontImpact: (r[8] || "").trim(), remarks: (r[9] || "").trim(), createdAt: ts })).filter(item => item.drawingNo), ...prev.drawings] })); } 
        else if (pasteType === "Actions") { setDb(prev => ({ ...prev, actions: [...rows.map((r, i) => ({ id: "ACT-" + ts + i, weekNo, category: (r[0] || "Execution").trim(), desc: (r[1] || "").trim(), responsibility: (r[2] || "TPL").trim(), targetDate: cleanDate(r[3]), revisedDate: cleanDate(r[4]), status: (r[5] || "Pending").trim(), ntpcRemarks: (r[6] || "").trim(), createdAt: ts })).filter(item => item.desc), ...prev.actions] })); } 
        else {
          const col = activeDiscipline === "Civil" ? "civilExecution" : activeDiscipline === "Mechanical" ? "mechExecution" : "elecExecution";
          const prefix = activeDiscipline === "Civil" ? "CV-" : activeDiscipline === "Mechanical" ? "MC-" : "EL-";
          setDb(prev => ({ ...prev, [col]: [...rows.map((r, i) => ({ id: prefix + ts + i, weekNo, l2Ref: (r[0] || "").trim(), taskName: (r[1] || "").trim(), unit: (r[2] || (activeDiscipline === "Civil" ? "m³" : "MT")).trim(), plan: parseFloat(r[3]) || 0, act: parseFloat(r[4]) || 0, next: parseFloat(r[5]) || 0, cumBacklog: parseFloat(r[6]) || 0, hindrance: (r[7] || "").trim(), tplRemarks: (r[8] || "").trim(), ntpcDirectives: (r[9] || "").trim(), milestone: "In Progress", createdAt: ts })).filter(item => item.taskName), ...prev[col]] }));
        }
        setPasteText(""); setShowPasteModal(false);
      };

      const handleTaskChange = (taskId, field, val, collection) => {
        setDb(prev => ({ ...prev, [collection]: prev[collection].map(item => {
            if (item.id !== taskId) return item;
            const nextItem = { ...item, [field]: val };
            if (field === 'plan' || field === 'act') {
              const p = parseFloat(field === 'plan' ? val : nextItem.plan) || 0;
              const a = parseFloat(field === 'act' ? val : nextItem.act) || 0;
              nextItem.cumBacklog = Math.max(0, (parseFloat(item.prevBacklog||0)) + (p - a));
            }
            return nextItem;
          })
        }));
      };

      const handleAddRow = (type) => {
        const ts = Date.now();
        if (type === "L2") { setDb(prev => ({ ...prev, l2Schedule: [{ id: "L2-"+ts, discipline: "Civil", desc: "", l2Start: "", actStart: "", l2End: "", actEnd: "", createdAt: ts }, ...prev.l2Schedule] })); } 
        else if (type === "Team") { setDb(prev => ({ ...prev, teamMaster: [{ id: "TM-"+ts, empId: "", name: "", desig: "", dept: "", org: "NTPC", createdAt: ts }, ...prev.teamMaster] })); } 
        else if (type === "Drawings") { setDb(prev => ({ ...prev, drawings: [{ id: "DW-"+ts, weekNo, l2Ref: "", discipline: "Civil", drawingNo: "", desc: "", priority: "Moderate", targetDate: "", expectedDate: "", status: "Pending", frontImpact: "", remarks: "", createdAt: ts }, ...prev.drawings] })); } 
        else if (type === "Actions") { setDb(prev => ({ ...prev, actions: [{ id: "ACT-"+ts, weekNo, category: "Execution", desc: "", responsibility: "TPL", targetDate: "", revisedDate: "", status: "Pending", ntpcRemarks: "", createdAt: ts }, ...prev.actions] })); } 
        else {
          const col = type === "Civil" ? "civilExecution" : type === "Mechanical" ? "mechExecution" : "elecExecution";
          const prefix = type === "Civil" ? "CV-" : type === "Mechanical" ? "MC-" : "EL-";
          setDb(prev => ({ ...prev, [col]: [{ id: prefix+ts, weekNo, l2Ref: "", taskName: "", unit: type==="Civil"?"m³":type==="Mechanical"?"MT":"m", plan: 0, act: 0, next: 0, cumBacklog: 0, prevBacklog: 0, hindrance: "", tplRemarks: "", ntpcDirectives: "", milestone: "In Progress", createdAt: ts }, ...prev[col]] }));
        }
      };

      const handleSaveLog = async () => {
        if (!logForm.desc) return alert("Please enter an observation description.");
        setCloudStatus("Compressing Photo...");
        const ts = Date.now();
        let compressedBase64 = "";
        
        if (logForm.file) {
          compressedBase64 = await compressImage(logForm.file);
        }
        
        const collection = logForm.type === "Safety" ? "safetyLogs" : "qualityLogs";
        const prefix = logForm.type === "Safety" ? "SAF-" : "QAL-";
        const newEntry = { id: prefix + ts, weekNo, dept: logForm.dept, category: logForm.category, desc: logForm.desc, status: "Open", photoUrl: compressedBase64, createdAt: ts };
        
        setDb(prev => ({ ...prev, [collection]: [newEntry, ...prev[collection]] }));
        setShowLogModal(false);
        setLogForm({ type: "Safety", category: "Unsafe Condition", dept: "Civil", desc: "", file: null });
        setCloudStatus("Cloud Synced (<80ms)");
      };

      const toggleAttendee = (org, id) => {
        const emp = db.teamMaster.find(t => t.id === id);
        if (!emp) return;
        setDb(prev => {
          const field = org === 'NTPC' ? 'ntpcAttendees' : 'tplAttendees';
          const currentList = prev.weekMeta[weekNo][field] || [];
          const exists = currentList.find(a => a.id === id);
          let newList;
          if (exists) newList = currentList.filter(a => a.id !== id);
          else newList = [...currentList, { id: emp.id, name: emp.name, desig: emp.desig }];
          return { ...prev, weekMeta: { ...prev.weekMeta, [weekNo]: { ...prev.weekMeta[weekNo], [field]: newList } } };
        });
      };

      // Dashboard Computations
      const civilWk = db.civilExecution.filter(t => t.weekNo === weekNo);
      const mechWk = db.mechExecution.filter(t => t.weekNo === weekNo);
      const elecWk = db.elecExecution.filter(t => t.weekNo === weekNo);
      const getHitCount = (arr) => arr.filter(t => parseFloat(t.act) >= parseFloat(t.plan) && parseFloat(t.plan) > 0).length;
      
      const pendingDwgs = db.drawings.filter(d => d.weekNo === weekNo && !d.status.includes("Approved")).length;
      const openActs = db.actions.filter(a => a.weekNo === weekNo && a.status !== "Completed").length;
      const openHse = db.safetyLogs.filter(s => s.weekNo === weekNo && s.status === "Open").length;
      const openQal = db.qualityLogs.filter(q => q.weekNo === weekNo && q.status === "Open").length;

      // Smart Date Checking for Dashboard
      const calculateL2Delays = () => {
        const today = new Date(); today.setHours(0,0,0,0);
        let delayedStarts = 0; let delayedFinishes = 0;
        db.l2Schedule.forEach(l => {
          const l2s = l.l2Start ? new Date(l.l2Start) : null;
          const l2e = l.l2End ? new Date(l.l2End) : null;
          if (l2s && !l.actStart && today > l2s) delayedStarts++;
          if (l2e && !l.actEnd && today > l2e) delayedFinishes++;
        });
        return { delayedStarts, delayedFinishes };
      };
      const l2Metrics = calculateL2Delays();

      return (
        <div className="flex h-screen w-screen bg-slate-50 overflow-hidden font-sans text-sm">
          
          <aside className="w-64 bg-ntpc-navy text-white flex flex-col h-screen shadow-2xl flex-shrink-0 z-50 no-print">
            <div className="p-4 flex items-center gap-3 border-b border-white/10">
              <div className="w-10 h-10 bg-ntpc-orange text-white rounded-xl flex items-center justify-center font-black text-2xl shadow-md border border-white/20">N</div>
              <div><h1 className="text-sm font-black uppercase tracking-wider leading-none">Nabinagar STPP</h1><p className="text-[10px] text-orange-400 font-bold uppercase tracking-widest mt-1">Stage-II Portal</p></div>
            </div>

            <nav className="flex-1 px-3 py-4 space-y-2 overflow-y-auto custom-scroll">
              {[ { id: "DASHBOARD", icon: "📊", label: "Executive Summary" }, { id: "TEAM ROSTER", icon: "👥", label: "Master Team List" }, { id: "L2 SCHEDULE", icon: "📅", label: "L2 Master Fronts" }, { id: "EXECUTION", icon: "🏗️", label: "Discipline Execution" }, { id: "DRAWINGS", icon: "📐", label: "Engineering & DCI" }, { id: "HSE & QA", icon: "🛡️", label: "HSE & Quality NCR" }, { id: "ACTIONS", icon: "⚡", label: "Bottlenecks Tracker" } ].map(m => (
                <button key={m.id} onClick={() => setTab(m.id)} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-black uppercase tracking-wider transition-all ${tab === m.id ? "bg-ntpc-orange text-white shadow-md" : "text-slate-400 hover:bg-white/5 hover:text-white"}`}>
                  <span className="text-lg">{m.icon}</span>{m.label}
                </button>
              ))}
            </nav>

            <div className="p-4 border-t border-white/10 space-y-3 bg-slate-900/50">
              <div className="text-[10px] font-black uppercase text-slate-400 text-center tracking-widest mb-1">Data & Safety Tools</div>
              <button onClick={handleUndo} className="w-full bg-slate-700 hover:bg-slate-600 text-white py-2 rounded text-xs font-black uppercase flex items-center justify-center gap-2">↩ Undo Last Action</button>
              <button onClick={revertTwoHours} className="w-full bg-rose-900/50 hover:bg-rose-800 text-rose-300 py-2 rounded text-[10px] font-black uppercase border border-rose-800/50">⏰ Wipe Last 2 Hours</button>
            </div>
          </aside>

          <div className="flex-1 flex flex-col h-full overflow-hidden">
            
            <header className="bg-white border-b border-slate-200 px-6 py-3.5 flex items-center justify-between z-30 shadow-sm no-print">
              <div className="flex items-center gap-4">
                <span className="text-sm font-black text-ntpc-blue uppercase tracking-wider">Review Week:</span>
                <select value={weekNo} onChange={e => setWeekNo(parseInt(e.target.value))} className="bg-slate-100 font-black text-sm px-3 py-2 rounded-lg border border-slate-300 outline-none">
                  {db.weeks.map(w => <option key={w} value={w}>Week {w}</option>)}
                </select>
                <button onClick={() => {
                  const nx = parseInt(prompt("Enter New Week Number:", weekNo + 1));
                  if(nx && !db.weeks.includes(nx)) {
                    setDb(prev => {

                <tr>
                  <td><ul className="list-disc pl-4 m-0">{(currentMeta.ntpcAttendees || []).map((a, i) => <li key={i}><strong>{a.name}</strong> — {a.desig}</li>)}</ul></td>
                  <td><ul className="list-disc pl-4 m-0">{(currentMeta.tplAttendees || []).map((a, i) => <li key={i}><strong>{a.name}</strong> — {a.desig}</li>)}</ul></td>
                  <td className="font-bold text-center bg-[#f1f5f9] text-[12px] pt-4">Total Deployed Manpower: {currentMeta.manpower}<br/><br/>Total Persons Trained: {currentMeta.trained}</td>
                </tr>
              </tbody>
            </table>

            {printIncludeDashboard && (
              <React.Fragment>
                <h3 className="section-title">2. Executive Dashboard Summary</h3>
                <table>
                  <thead><tr><th>Civil Targets Hit</th><th>Mech Targets Hit</th><th>Elec Targets Hit</th><th>Pending Drawings</th><th>Open Bottlenecks</th><th>Open Safety/QA</th></tr></thead>
                  <tbody>
                    <tr>
                      <td className="text-center font-bold text-blue-900">{getHitCount(civilWk)} / {civilWk.length}</td>
                      <td className="text-center font-bold text-amber-700">{getHitCount(mechWk)} / {mechWk.length}</td>
                      <td className="text-center font-bold text-emerald-800">{getHitCount(elecWk)} / {elecWk.length}</td>
                      <td className="text-center font-bold">{pendingDwgs}</td>
                      <td className="text-center font-bold text-rose-700">{openActs}</td>
                      <td className="text-center font-bold">{openHse + db.qualityLogs.filter(q => q.weekNo === weekNo && q.status === "Open").length}</td>
                    </tr>
                  </tbody>
                </table>
              </React.Fragment>
            )}

            <h3 className="section-title">{printIncludeDashboard ? "3" : "2"}. Discipline Execution Performance</h3>
            <table>
              <thead><tr><th className="w-[22%]">Work Front & Task</th><th className="text-center w-10">Plan</th><th className="text-center w-10">Act</th><th className="text-center w-10">Var</th><th className="text-center w-10">Backlog</th><th className="w-[18%]">Hindrance</th><th className="w-[18%]">TPL Remarks</th><th className="w-[18%]">NTPC Directives</th></tr></thead>
              <tbody>
                {[...civilWk, ...mechWk, ...elecWk].map((c, i) => (
                  <tr key={i}>
                    <td><strong>{c.l2Ref}</strong><br/>{c.taskName} ({c.unit})</td>
                    <td className="text-center font-bold text-blue-900">{c.plan}</td>
                    <td className="text-center font-bold text-emerald-800">{c.act}</td>
                    <td className="text-center font-black">{(parseFloat(c.act) || 0) - (parseFloat(c.plan) || 0)}</td>
                    <td className="text-center font-bold text-rose-800">{c.cumBacklog}</td>
                    <td>{c.hindrance}</td><td>{c.tplRemarks}</td><td className="font-bold">{c.ntpcDirectives}</td>
                  </tr>
                ))}
              </tbody>
            </table>

            <div className="page-break"></div>
            
            <div className="print-header-box">
              <h1 className="print-title">Nabinagar Super Thermal Power Project</h1>
              <div className="header-gradient-line"></div>
            </div>

            <h3 className="section-title">{printIncludeDashboard ? "4" : "3"}. Priority Actions & Bottlenecks</h3>
            <table>
              <thead><tr><th className="w-[30%]">Action Description</th><th className="w-[15%]">Resp</th><th className="text-center w-[15%]">Target</th><th className="text-center w-[10%]">Status</th><th className="w-[30%]">NTPC Review Directives</th></tr></thead>
              <tbody>
                {db.actions.filter(a => a.weekNo === weekNo).map((a, i) => (
                  <tr key={i}>
                    <td><strong>{a.desc}</strong></td><td>{a.responsibility}</td>
                    <td className="text-center font-bold">{a.targetDate}</td><td className="text-center font-bold uppercase">{a.status}</td>
                    <td className="font-bold">{a.ntpcRemarks}</td>
                  </tr>
                ))}
              </tbody>
            </table>

            <h3 className="section-title">{printIncludeDashboard ? "5" : "4"}. HSE & Quality Assurance Logs</h3>
            <table>
              <thead><tr><th className="w-[20%]">Dept & Category</th><th className="w-[50%]">Observation Detail</th><th className="text-center w-[15%]">Status</th>{printIncludePhotos && <th className="text-center w-[15%]">Evidence</th>}</tr></thead>
              <tbody>
                {[...db.safetyLogs, ...db.qualityLogs].filter(s => s.weekNo === weekNo).map((s, i) => (
                  <tr key={i}>
                    <td><strong>{s.dept || "Site"}</strong><br/>{s.category}</td>
                    <td>{s.desc}</td>
                    <td className="text-center font-bold uppercase">{s.status}</td>
                    {printIncludePhotos && (
                      <td className="text-center">{s.photoUrl ? <img src={s.photoUrl} className="photo-box mx-auto" /> : "No Photo"}</td>
                    )}
                  </tr>
                ))}
              </tbody>
            </table>

            <div className="mt-24 flex justify-between text-[11px] font-bold uppercase px-12">
              <div className="text-center border-t-2 border-slate-400 pt-2 w-48">Employer Representative<br/><strong>(NTPC Limited)</strong></div>
              <div className="text-center border-t-2 border-slate-400 pt-2 w-48">Contractor Representative<br/><strong>(M/s TPL)</strong></div>
            </div>
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
